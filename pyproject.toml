[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fastmap"
version = "0.2.0"
description = "Print-ready PDF maps of Finland from MML raster and vector data"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "Pillow>=10.0",
    "reportlab>=4.0",
    "tzdata>=2024.1",
    "rl_accel>=0.9",
    "mapbox-vector-tile>=2.1",
    "shapely>=2.1",
    "numpy>=1.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fastmap = ["vector/styles/*.json", "vector/fonts/*", "services/*.COF"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
