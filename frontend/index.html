<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastMap – tulostuskelpoiset kartat</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@10/ol.css">
    <style>
        html, body { height: 100%; margin: 0; font-family: system-ui, sans-serif; }
        #map { position: absolute; inset: 0; }

        .panel {
            position: absolute; top: 12px; left: 12px; z-index: 1000;
            background: rgba(255,255,255,.96); border-radius: 8px;
            padding: 14px 16px; width: 250px;
            box-shadow: 0 2px 10px rgba(0,0,0,.25);
        }
        .panel h1 { font-size: 16px; margin: 0 0 10px; }
        .panel label { display: block; font-size: 12px; color: #333; margin: 8px 0 2px; }
        .panel select, .panel input {
            width: 100%; box-sizing: border-box; padding: 5px;
            border: 1px solid #bbb; border-radius: 4px; font-size: 13px;
        }
        .row { display: flex; gap: 8px; }
        .row > div { flex: 1; }
        #info { font-size: 12px; color: #555; margin-top: 10px; line-height: 1.45; }
        #generateBtn {
            margin-top: 12px; width: 100%; padding: 9px;
            background: #1a6b3c; border: none; border-radius: 5px;
            color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
        }
        #generateBtn:hover { background: #14572f; }
        #generateBtn:disabled { background: #9bbfa8; cursor: wait; }
        #status { font-size: 12px; margin-top: 8px; min-height: 15px; }
        #status.error { color: #b00020; font-weight: 600; }
        .hint {
            position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
            z-index: 1000; background: rgba(255,255,255,.85); border-radius: 4px;
            padding: 4px 12px; font-size: 12px; color: #444;
        }
    </style>
</head>
<body>
<div id="map"></div>

<div class="panel">
    <h1>FastMap</h1>

    <div class="row">
        <div>
            <label for="paperSize">Paperi</label>
            <select id="paperSize">
                <option value="A4" selected>A4</option>
                <option value="A3">A3</option>
            </select>
        </div>
        <div>
            <label for="orientation">Asento</label>
            <select id="orientation">
                <option value="portrait" selected>Pysty</option>
                <option value="landscape">Vaaka</option>
            </select>
        </div>
    </div>

    <label for="scale">Mittakaava 1:</label>
    <input id="scale" type="number" value="20000" step="5000" min="500" max="1000000">

    <label for="baseLayer">Taustakartta</label>
    <select id="baseLayer">
        <option value="maastokartta" selected>Maastokartta</option>
        <option value="taustakartta">Taustakartta</option>
        <option value="selkokartta">Selkokartta</option>
        <option value="ortokuva">Ortoilma kuva</option>
    </select>

    <label for="title">Otsikko (valinnainen)</label>
    <input id="title" type="text" maxlength="120" placeholder="es. Mökki Koli">

    <button id="generateBtn">Lataa PDF</button>
    <div id="status"></div>

    <div id="info"></div>
</div>

<div class="hint">Vedä punaista aluetta siirtääksesi · kaksoisnapsauta keskitä · valitse paperi ja mittakaava vasemmalta</div>

<script type="importmap">
{
    "imports": {
        "ol": "https://cdn.jsdelivr.net/npm/ol@10/index.js",
        "ol/": "https://cdn.jsdelivr.net/npm/ol@10/",
        "proj4": "https://cdn.jsdelivr.net/npm/proj4@2/+esm"
    }
}
</script>

<script type="module">
    import Map from 'ol/Map.js';
    import View from 'ol/View.js';
    import TileLayer from 'ol/layer/Tile.js';
    import VectorLayer from 'ol/layer/Vector.js';
    import TileImage from 'ol/source/TileImage.js';
    import VectorSource from 'ol/source/Vector.js';
    import Feature from 'ol/Feature.js';
    import Polygon from 'ol/geom/Polygon.js';
    import Style from 'ol/style/Style.js';
    import Stroke from 'ol/style/Stroke.js';
    import Fill from 'ol/style/Fill.js';
    import TileGrid from 'ol/tilegrid/TileGrid.js';
    import Translate from 'ol/interaction/Translate.js';
    import proj4 from 'proj4';
    import { register } from 'ol/proj.js';

    // --- EPSG:3067 (ETRS-TM35FIN) -----------------------------------------
    proj4.defs('EPSG:3067',
        '+proj=utm +zone=35 +ellps=GRS80 +towgs84=0,0,0 +units=m +no_defs');
    register(proj4);
    const PROJ = 'EPSG:3067';
    const MAX_EXTENT = [-548576, 6291456, 1548576, 8388608];

    // NLS ETRS-TM35FIN tile matrix set: res = 8192 / 2^z, origin top-left
    const RESOLUTIONS = Array.from({ length: 15 }, (_, z) => 8192 / 2 ** z);

    function makeBaseSource(layer) {
        return new TileImage({
            projection: PROJ,
            tileGrid: new TileGrid({
                origin: [-548576, 8388608],
                resolutions: RESOLUTIONS,
                tileSize: 256,
            }),
            tileUrlFunction: ([z, x, y]) =>
                `/api/nls-tiles/${z}/${x}/${y}.png?layer=${layer}`,
        });
    }

    const baseLayer = new TileLayer({ source: makeBaseSource('maastokartta') });

    // --- Paper footprint rectangle ----------------------------------------
    const PAPER_MM = { A4: [210, 297], A3: [297, 420] };

    let rectFeature = null;

    function rectCenter() {
        if (rectFeature) {
            const e = rectFeature.getGeometry().getExtent();
            return [(e[0] + e[2]) / 2, (e[1] + e[3]) / 2];
        }
        return view.getCenter();
    }

    function updateRect() {
        const paper = document.getElementById('paperSize').value;
        const orient = document.getElementById('orientation').value;
        const scale = parseInt(document.getElementById('scale').value, 10) || 20000;

        let [wmm, hmm] = PAPER_MM[paper];
        if (orient === 'landscape') [wmm, hmm] = [hmm, wmm];
        const w_m = wmm / 1000 * scale;
        const h_m = hmm / 1000 * scale;

        const [cx, cy] = rectCenter();
        const coords = [
            [cx - w_m / 2, cy - h_m / 2],
            [cx + w_m / 2, cy - h_m / 2],
            [cx + w_m / 2, cy + h_m / 2],
            [cx - w_m / 2, cy + h_m / 2],
            [cx - w_m / 2, cy - h_m / 2],
        ];

        if (!rectFeature) {
            rectFeature = new Feature(new Polygon([coords]));
            vectorLayer.getSource().addFeature(rectFeature);
        } else {
            rectFeature.getGeometry().setCoordinates([coords]);
        }

        const km = v => v >= 1000 ? `${(v / 1000).toLocaleString('fi-FI')} km` : `${Math.round(v)} m`;
        document.getElementById('info').innerHTML =
            `Alue: ${km(w_m)} × ${km(h_m)}<br>` +
            `Paperi: ${paper} ${orient === 'portrait' ? 'pysty' : 'vaaka'}, 1:${scale.toLocaleString('fi-FI')}`;
    }

    const vectorLayer = new VectorLayer({
        source: new VectorSource(),
        style: new Style({
            stroke: new Stroke({ color: '#d40000', width: 2 }),
            fill: new Fill({ color: 'rgba(255, 60, 60, 0.08)' }),
        }),
    });

    const view = new View({
        projection: PROJ,
        center: [430000, 6668000],   // Otaniemi / Espoo
        resolution: 128,
        extent: MAX_EXTENT,
    });

    const map = new Map({
        target: 'map',
        layers: [baseLayer, vectorLayer],
        view,
    });

    updateRect();

    // Drag the rectangle with the mouse
    map.addInteraction(new Translate({ layers: [vectorLayer] }));

    // Double-click centers the rectangle there
    map.on('dblclick', e => {
        const ext = rectFeature.getGeometry().getExtent();
        const cx = e.coordinate[0], cy = e.coordinate[1];
        const hw = (ext[2] - ext[0]) / 2, hh = (ext[3] - ext[1]) / 2;
        const coords = [
            [cx - hw, cy - hh], [cx + hw, cy - hh],
            [cx + hw, cy + hh], [cx - hw, cy + hh], [cx - hw, cy - hh],
        ];
        rectFeature.getGeometry().setCoordinates([coords]);
    });

    for (const id of ['paperSize', 'orientation', 'scale']) {
        document.getElementById(id).addEventListener('change', updateRect);
        document.getElementById(id).addEventListener('input', updateRect);
    }

    document.getElementById('baseLayer').addEventListener('change', e => {
        baseLayer.setSource(makeBaseSource(e.target.value));
    });

    // --- PDF generation ----------------------------------------------------
    const btn = document.getElementById('generateBtn');
    const statusEl = document.getElementById('status');

    function setStatus(msg, isError = false) {
        statusEl.textContent = msg;
        statusEl.classList.toggle('error', isError);
    }

    btn.addEventListener('click', async () => {
        if (!rectFeature) return;
        const [minx, miny, maxx, maxy] =
            rectFeature.getGeometry().getExtent();

        const payload = {
            bbox: { minx, miny, maxx, maxy },
            scale: parseInt(document.getElementById('scale').value, 10),
            paper_size: document.getElementById('paperSize').value,
            orientation: document.getElementById('orientation').value,
            layer: document.getElementById('baseLayer').value,
            dpi: 300,
        };
        const title = document.getElementById('title').value.trim();
        if (title) payload.title = title;

        btn.disabled = true;
        setStatus('Laaditaan karttaa… tämä voi kestää hetken.');

        try {
            const resp = await fetch('/generate-map', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload),
            });
            if (!resp.ok) {
                let detail = `HTTP ${resp.status}`;
                try {
                    const err = await resp.json();
                    if (err.detail) detail = typeof err.detail === 'string'
                        ? err.detail : JSON.stringify(err.detail);
                } catch { /* ignore */ }
                throw new Error(detail);
            }

            const blob = await resp.blob();
            let filename = 'fastmap.pdf';
            const disposition = resp.headers.get('content-disposition');
            if (disposition) {
                const m = disposition.match(/filename="?([^";]+)"?/i);
                if (m) filename = decodeURIComponent(m[1]);
            }
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);

            setStatus(`Valmis! Ladataan ${filename}`);
        } catch (err) {
            setStatus(`Virhe: ${err.message}`, true);
        } finally {
            btn.disabled = false;
        }
    });
</script>
</body>
</html>
